# `bun run check` for Postrider on every push that touches it: fmt, clippy
# and the Rust tests (the desktop shell too), generated types and design
# copies up to date, Vite+ (Oxfmt, Oxlint, tsc), the bun tests (the kits'
# too) and the web build. It runs on the MacBook's runner (label `macos`).
#
# On push only, never on pull_request: the runner is the Mac itself, and a
# pull request from someone else's fork would run their code there.
name: postrider

on:
  workflow_dispatch:
  push:
    paths:
      - "code/apps/postrider/**"
      - "code/kit/**"
      - "studio/design/tokens/**"
      - "studio/design/components.css"
      - "studio/brand/mark/postrider.svg"
      - ".forgejo/workflows/postrider.yml"

jobs:
  check:
    runs-on: macos
    defaults:
      run:
        working-directory: code/apps/postrider
    env:
      # Line numbers for a failing test's backtrace, without the rest of the
      # debug info: less to compile and link.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      # No test needs Postgres or the stand-in mail servers yet, so nothing
      # starts in Docker. The crates.io builds are kept between jobs, so a
      # push doesn't recompile those. The vault's own crates are built anew
      # every time and removed after the check (`kit/dev-id/trim-ci-target.ts`
      # says why).
      - run: CARGO_TARGET_DIR="$HOME/.cache/forgejo-runner/postrider-target" bun run check
      - if: always()
        run: bun ../../kit/dev-id/trim-ci-target.ts "$HOME/.cache/forgejo-runner/postrider-target"
