# `bun run check` for Layer on every push that touches it: the guard, design
# copies up to date, the app's tests, tsc and build, rustfmt on the server,
# clippy, the app's and the server's Rust tests, generated types up to date,
# and the web app's Biome, tsc, tests and build. It runs on the MacBook's
# runner (label `macos`), because the app and its PTY tests are macOS-only.
#
# On push only, never on pull_request: the runner is the Mac itself, and a
# pull request from someone else's fork would run their code there.
name: layer

on:
  workflow_dispatch:
  push:
    paths:
      - "code/apps/layer/**"
      - "code/kit/**"
      - "studio/design/tokens/**"
      - "studio/design/components.css"
      - ".forgejo/workflows/layer.yml"

jobs:
  check:
    runs-on: macos
    defaults:
      run:
        working-directory: code/apps/layer
    env:
      # Line numbers for a failing test's backtrace, without the rest of the
      # debug info: less to compile and link.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - run: bun install --frozen-lockfile
      # The server's tests need Postgres: the same container as local
      # development (port 5436), started if it isn't running. Each test gets
      # a database of its own and drops it, so the dev data is never touched.
      - run: bun run db
      # The git tests commit in temp repos and need an identity: a global
      # config of the job's own, since on this Mac `git config --global`
      # would be the owner's. Not GIT_AUTHOR_*/GIT_COMMITTER_*: those beat
      # the identity a test sets in its repo, and two tests check that one.
      # Every job gets a fresh checkout; the Rust build is kept between them
      # so a push recompiles what changed, not the whole app.
      - run: |
          export GIT_CONFIG_GLOBAL="$(mktemp)"
          git config --global user.name ci
          git config --global user.email ci@localhost
          CARGO_TARGET_DIR="$HOME/.cache/forgejo-runner/layer-target" bun run check
