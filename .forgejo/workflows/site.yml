# The website's build on every push that could change it: build.py checks
# every local HTML and CSS dependency and fails on a missing one.
name: site

on:
  workflow_dispatch:
  push:
    paths:
      - "code/apps/site/**"
      - "studio/design/tokens/**"
      - "studio/brand/mark/**"
      - "studio/content/blog/**"
      - ".forgejo/workflows/site.yml"

jobs:
  build:
    runs-on: macos
    defaults:
      run:
        working-directory: code/apps/site
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest
      - run: python3 build.py
