# The website's build on every push that could change it: build.py checks
# every local HTML and CSS dependency and fails on a missing one. Vite+
# formats and lints its script and CSS (vite.config.ts).
name: site

on:
  workflow_dispatch:
  push:
    paths:
      - "code/apps/site/**"
      - "studio/design/tokens/**"
      - "studio/brand/mark/**"
      - "studio/content/blog/**"
      - "code/kit/dev-id/vite-plus.ts"
      - ".forgejo/workflows/site.yml"

jobs:
  build:
    runs-on: macos
    defaults:
      run:
        working-directory: code/apps/site
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest
      - run: python3 build.py
      - run: bun install --frozen-lockfile && bun run check
