# Design drift on every push that could cause it: the theme tests, the
# generated outputs in studio/design/tokens against build.py, Forge's, Layer's,
# Caster's, Glyph's and the editor themes' copies against the vault, and the lint
# guard over the web CSS and the apps' TSX (studio/design/lint; not the site's
# HTML). Each check
# writes nothing and fails with the fix.
name: design

on:
  workflow_dispatch:
  push:
    paths:
      - "studio/design/tokens/**"
      - "studio/design/components.css"
      - "studio/design/lint/**"
      - "code/apps/site/**/*.css"
      - "code/apps/forge/apps/web/src/**"
      - "code/apps/layer/src/**"
      - "DESIGN.md"
      - "studio/brand/mark/**"
      - "code/apps/site/assets/fonts/**"
      - "code/apps/forge/apps/web/src/design/**"
      - "code/apps/forge/apps/web/public/icon.svg"
      - "code/apps/forge/scripts/sync-design.ts"
      - "code/apps/layer/src/design/**"
      - "code/apps/layer/scripts/sync-design.ts"
      - "code/apps/caster/Sources/VillainCaster/Design/**"
      - "code/apps/caster/Sources/VillainCaster/MenuBarIcon.swift"
      - "code/apps/caster/Resources/Fonts/**"
      - "code/apps/caster/Resources/AppIcon.svg"
      - "code/apps/caster/Makefile"
      - "code/apps/theme/**"
      - "code/apps/glyph/apps/web/src/**"
      - "code/apps/glyph/apps/web/public/icon.svg"
      - "code/apps/glyph/scripts/sync-design.ts"
      - "code/apps/raven/apps/web/src/**"
      - "code/apps/raven/apps/web/public/icon.svg"
      - "code/apps/raven/scripts/sync-design.ts"
      - ".forgejo/workflows/design.yml"

jobs:
  drift:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s . -p 'test_*.py'
        working-directory: studio/design/tokens
      - run: python3 build.py --check
        working-directory: studio/design/tokens
      - run: bun scripts/sync-design.ts --check
        working-directory: code/apps/forge
      - run: bun scripts/sync-design.ts --check
        working-directory: code/apps/layer
      - run: make design-check
        working-directory: code/apps/caster
      - run: bun build.ts --check
        working-directory: code/apps/theme
      - run: bun scripts/sync-design.ts --check
        working-directory: code/apps/glyph
      - run: bun scripts/sync-design.ts --check
        working-directory: code/apps/raven
      - run: bun install --frozen-lockfile && bun run check
        working-directory: studio/design/lint
