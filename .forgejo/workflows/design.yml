# Design drift on every push that could cause it: the theme tests, the
# generated outputs in design/tokens against build.py, Forge's, Layer's,
# Caster's, Glyph's and the editor themes' copies against the vault, and the lint
# guard over the web CSS and the apps' TSX (design/lint; not the site's
# HTML). Each check
# writes nothing and fails with the fix.
name: design

on:
  workflow_dispatch:
  push:
    paths:
      - "design/tokens/**"
      - "design/components.css"
      - "design/lint/**"
      - "apps/site/**/*.css"
      - "apps/forge/apps/web/src/**"
      - "apps/layer/src/**"
      - "DESIGN.md"
      - "brand/mark/**"
      - "apps/site/assets/fonts/**"
      - "apps/forge/apps/web/src/design/**"
      - "apps/forge/apps/web/public/icon.svg"
      - "apps/forge/scripts/sync-design.ts"
      - "apps/layer/src/design/**"
      - "apps/layer/scripts/sync-design.ts"
      - "apps/caster/Sources/VillainCaster/Design/**"
      - "apps/caster/Sources/VillainCaster/MenuBarIcon.swift"
      - "apps/caster/Resources/Fonts/**"
      - "apps/caster/Resources/AppIcon.svg"
      - "apps/caster/Makefile"
      - "apps/theme/**"
      - "apps/glyph/apps/web/src/**"
      - "apps/glyph/apps/web/public/icon.svg"
      - "apps/glyph/scripts/sync-design.ts"
      - "apps/raven/apps/web/src/**"
      - "apps/raven/apps/web/public/icon.svg"
      - "apps/raven/scripts/sync-design.ts"
      - ".forgejo/workflows/design.yml"

jobs:
  drift:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s . -p 'test_*.py'
        working-directory: design/tokens
      - run: python3 build.py --check
        working-directory: design/tokens
      - run: bun scripts/sync-design.ts --check
        working-directory: apps/forge
      - run: bun scripts/sync-design.ts --check
        working-directory: apps/layer
      - run: make design-check
        working-directory: apps/caster
      - run: bun build.ts --check
        working-directory: apps/theme
      - run: bun scripts/sync-design.ts --check
        working-directory: apps/glyph
      - run: bun scripts/sync-design.ts --check
        working-directory: apps/raven
      - run: bun install --frozen-lockfile && bun run check
        working-directory: design/lint
