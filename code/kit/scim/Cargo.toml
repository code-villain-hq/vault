[package]
name = "code-villain-scim"
description = "People and groups pushed by the Code Villain account (Pocket ID) over SCIM 2.0, and the workspace roles they give, for any app's server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1", features = ["time"] }
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "chrono", "macros"] }
tracing = "0.1"
uuid = { version = "1.28", features = ["v7", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
