[package]
name = "code-villain-auth"
description = "Company sign-in for any studio app server: OpenID Connect, sessions, and desktop handoff"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8.9"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
uuid = { version = "1.28", features = ["v7", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
