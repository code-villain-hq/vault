[package]
name = "code-villain-notify"
description = "Notifications from a studio desktop app, the way macOS shows them now"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSObject", "NSString", "NSUUID"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# The kit that talks to Objective-C, so the one with `unsafe`: each block says
# why it's sound.
[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
