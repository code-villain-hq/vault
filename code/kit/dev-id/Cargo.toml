[package]
name = "code-villain-dev-id"
description = "A stand-in for a company's account in local development: its sign-in (OpenID Connect) and its people and groups (SCIM)"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "dev-id"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8.9"
base64 = "0.22"
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
