# Layer's Rust: the desktop app (`src-tauri`) and Layer's server
# (`crates/`), which keeps a workspace's shared setup on Postgres with the
# studio's sync engine (`code/kit/sync`). The app keeps its own edition and
# dependencies; the server crates share the ones below, as Raven's do.
[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
http = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl", "serde-json-impl"] }
uuid = { version = "1.28", features = ["v7", "serde"] }

code-villain-desktop = { path = "../../kit/desktop" }
code-villain-sync = { path = "../../kit/sync" }
layer-domain = { path = "crates/domain" }
layer-server = { path = "crates/server" }
layer-sync = { path = "crates/sync" }

# Password hashing is deliberately slow; unoptimised it makes tests crawl.
[profile.dev.package.argon2]
opt-level = 3

# `panic = "abort"`: a panic anywhere quits the app and every agent in it,
# so shipped code has none (the guard's `panic` rule).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
