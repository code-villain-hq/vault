[package]
name = "villain-layer"
version = "0.11.0"
description = "Layer - an agent development environment"
authors = ["Code Villain <codevillain@proton.me>"]
license = "MIT OR Apache-2.0"
homepage = "https://www.codevillain.eu/"
repository = "https://git.codevillain.eu/code-villain/vault"
edition = "2021"

[lib]
name = "villain_layer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
axum = "0.8"
portable-pty = "0.9"

# 0.13.5, for the bundled Postgres's download (`postgresql_archive`). Its
# `rustls` checks certificates with macOS's own trust store, as the
# `rustls-native-certs` it replaced did with the system's roots.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2", "charset", "system-proxy"] }
# The Slack bot's Socket Mode connection (BOT-1): reqwest has no
# websocket client. rustls with the system's roots.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

keyring = "4"

thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
parking_lot = "0.13"
libc = "0.2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
notify-rust = "4"
# Profiles (§25): bringing another copy of the app forward, and marking each
# copy's Dock icon. Tauri has neither. Already in the build through tao, so
# no new crates: only these classes' bindings are added. NSPasteboard and
# NSData put the browser's screenshot on the clipboard as a PNG (BRW-22).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSGeometry", "NSAttributedString", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSImage", "NSBezierPath", "NSColor", "NSFont", "NSStringDrawing", "NSAttributedString", "NSPasteboard", "objc2-core-foundation", "libc"] }
# Workspaces (§25): each runs Layer's server on its own Postgres, bundled
# in the app (`workspace.rs`), and keeps its shared setup there.
code-villain-desktop = { workspace = true }
layer-domain = { workspace = true }
layer-server = { workspace = true }
layer-sync = { workspace = true }
sqlx = { workspace = true }
# Signing in to a Layer server with Code Villain (PROF-15, PROF-17): the
# browser hands the sign-in back on `layer://signed-in`, and the app proves
# it started it with the SHA-256 of a secret. sha2 and hex are in the build
# already, through layer-server; the plugin is the studio's (Forge, Glyph).
tauri-plugin-deep-link = "2.6.1"
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# A mock runtime, so the PTY layer can be driven through real processes in
# tests without a window.
tauri = { version = "2", features = ["test"] }
