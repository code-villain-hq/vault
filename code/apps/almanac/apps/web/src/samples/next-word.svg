<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <title>How a language model writes, a word at a time</title>
  <rect width="640" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#5b6470"/>
    </marker>
  </defs>
  <g font-size="15" fill="#1f2328" text-anchor="middle">
    <rect x="24" y="78" width="132" height="64" rx="10" fill="#eef2f7" stroke="#c9d1db"/>
    <text x="90" y="106">The cat sat</text>
    <text x="90" y="126" font-size="12" fill="#5b6470">the words so far</text>

    <rect x="196" y="78" width="132" height="64" rx="10" fill="#eef2f7" stroke="#c9d1db"/>
    <text x="262" y="106">the · cat · sat</text>
    <text x="262" y="126" font-size="12" fill="#5b6470">tokens</text>

    <rect x="368" y="62" width="112" height="96" rx="14" fill="#e3f0d9" stroke="#9fc285"/>
    <text x="424" y="106" font-weight="600">Model</text>
    <text x="424" y="126" font-size="12" fill="#4b6b36">weighs every word</text>

    <rect x="520" y="78" width="100" height="64" rx="10" fill="#eef2f7" stroke="#c9d1db"/>
    <text x="570" y="106">on</text>
    <text x="570" y="126" font-size="12" fill="#5b6470">most likely next</text>
  </g>
  <g stroke="#5b6470" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M158 110h34"/>
    <path d="M330 110h34"/>
    <path d="M482 110h34"/>
    <path d="M570 144v52H90v-52"/>
  </g>
  <text x="330" y="218" font-size="12" fill="#5b6470" text-anchor="middle">added to the words, and again, until the answer ends</text>
</svg>
