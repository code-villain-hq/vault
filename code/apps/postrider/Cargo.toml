[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
futures = "0.3"
keyring = "4.2"
# Sending replies over SMTP, with TLS that trusts what macOS trusts.
lettre = { version = "0.11.23", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls",
  "rustls-platform-verifier",
  "aws-lc-rs",
] }
mail-parser = "1"
quick-xml = "0.42"
reqwest = { version = "0.13", features = ["json"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-none",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
  "macros",
] }
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl", "serde-json-impl"] }
uuid = { version = "1.28", features = ["v7", "serde"] }

code-villain-desktop = { path = "../../kit/desktop" }
code-villain-auth = { path = "../../kit/auth" }
code-villain-sync = { path = "../../kit/sync" }
code-villain-notify = { path = "../../kit/notify" }
code-villain-claude = { path = "../../kit/claude" }
postrider-domain = { path = "crates/domain" }
postrider-server = { path = "crates/server" }
postrider-sync = { path = "crates/sync" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
