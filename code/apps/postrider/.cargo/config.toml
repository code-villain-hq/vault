# Environment for `cargo run` and `cargo test` in local development.
[env]
DATABASE_URL = "postgres://postrider:postrider@localhost:5438/postrider"
TS_RS_EXPORT_DIR = { value = "packages/types/src/generated", relative = true }
# The Postgres the desktop app bundles (code/kit/desktop).
POSTGRESQL_VERSION = "=18.6.1"
