<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title · Code Villain</title>
  <meta name="description" content="$summary">
  <link rel="canonical" href="https://www.codevillain.eu/blog/$slug.html">
  <meta property="og:site_name" content="Code Villain">
  <meta property="og:title" content="$title · Code Villain">
  <meta property="og:description" content="$summary">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://www.codevillain.eu/blog/$slug.html">
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="icon" href="../../../../studio/brand/mark/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../../studio/design/tokens/color.css">
  <link rel="stylesheet" href="../../../../studio/design/tokens/type.css">
  <link rel="stylesheet" href="../../../../studio/design/tokens/shape.css">
  <link rel="stylesheet" href="../../../../studio/design/components.css">
  <link rel="stylesheet" href="../../../../studio/design/tokens/syntax.css">
  <link rel="stylesheet" href="../site.css">
</head>
<body>
  <header class="wrap site-head">
    <a class="site-logo" href="../"><img src="../../../../studio/brand/mark/logo-night.svg" alt="Code Villain" width="168" height="35"></a>
    <nav class="site-nav" aria-label="Site">
      <a class="ui-link" href="./" aria-current="page">The log</a>
      <a class="ui-link" href="../#products">Tools</a>
    </nav>
  </header>

  <main class="wrap">
    <!-- Generated by build.py from studio/content/blog/$source. Edit the Markdown, not this page. -->
    <article class="post">
      <p class="post-meta">
        <a class="ui-link" href="./">The log</a>
        <span aria-hidden="true">·</span>
        <span>$product</span>
        <span aria-hidden="true">·</span>
        <time datetime="$date">$day</time>
        <span aria-hidden="true">·</span>
        <span>$minutes min read</span>$draft
      </p>

      <h1>$title</h1>

$body

      <footer class="post-foot"><a class="ui-link" href="./">All posts</a></footer>
    </article>
  </main>

  <footer class="wrap site-foot">
    <span>Code Villain builds real tools and shows the build.</span>
    <nav aria-label="Footer">
      <a class="ui-link" href="./">The log</a>
      <a class="ui-link" href="../#products">Tools</a>
    </nav>
  </footer>
</body>
</html>
