<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$name · Code Villain</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="https://www.codevillain.eu/$slug/">
  <meta property="og:site_name" content="Code Villain">
  <meta property="og:title" content="$name · Code Villain">
  <meta property="og:description" content="$description">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.codevillain.eu/$slug/">
  <link rel="stylesheet" href="../assets/fonts/fonts.css">
  <link rel="icon" href="../../../../studio/brand/mark/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../../../studio/design/tokens/color.css">
  <link rel="stylesheet" href="../../../../studio/design/tokens/type.css">
  <link rel="stylesheet" href="../../../../studio/design/tokens/shape.css">
  <link rel="stylesheet" href="../../../../studio/design/components.css">
  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="../product.css">
  <script src="../menu.js" defer></script>
</head>
<body>
  <!-- Generated by build.py from studio/content/products/$slug.toml. -->
  <header class="page-width site-head">
    <a class="site-logo" href="../"><img src="../../../../studio/brand/mark/logo-night.svg" alt="Code Villain" width="168" height="35"></a>
    <nav class="site-nav" aria-label="Main">
$menu
    </nav>
  </header>

  <main class="page-width product-page">
    <header class="product-hero">
      <div>
        <div class="product-title"><img src="$icon" width="56" height="56" alt=""><h1>$name</h1></div>
        <p class="product-lead">$lead</p>
        <p class="product-fact">$fact</p>
      </div>
      <p class="product-links">$get</p>
    </header>
    $hero

$features

    <ul class="product-points">$points
    </ul>
  </main>

  <footer class="page-width site-foot">
    <span>Code Villain builds real tools and shows the build.</span>
    <nav aria-label="Footer">
      <a class="ui-link" href="../#products">All products</a>
      <a class="ui-link" href="../blog/">The log</a>
    </nav>
  </footer>
</body>
</html>
