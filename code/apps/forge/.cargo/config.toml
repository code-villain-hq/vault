# Environment for `cargo run` and `cargo test` in local development.
[env]
DATABASE_URL = "postgres://forge:forge@localhost:5433/forge"
TS_RS_EXPORT_DIR = { value = "packages/types/src/generated", relative = true }
# Local development runs on plain http, so session cookies can't be Secure.
FORGE_COOKIE_SECURE = "0"
# Services may use repositories on disk below this folder (the one containing
# the vault, where Forge's own services use villain-vault). Drift checks also
# need ANTHROPIC_API_KEY.
FORGE_LOCAL_REPOS_ROOT = { value = "../../../..", relative = true }
# The Postgres the desktop app bundles (code/kit/desktop).
POSTGRESQL_VERSION = "=18.6.1"
