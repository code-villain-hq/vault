name: villain-forge
services:
  postgres:
    image: postgres:18
    # Come back after Docker restarts, unless stopped on purpose.
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      # 5433 on this machine only, so it doesn't clash with a local Postgres
      # on 5432 and nobody else on the network can reach the data.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The whole app, as the team uses it: `bun run app`, then http://localhost:7390.
  forge:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # This machine only by default. For teammates, put it behind https and
      # set FORGE_LISTEN, e.g. 0.0.0.0:7390 (and drop FORGE_COOKIE_SECURE).
      - "${FORGE_LISTEN:-127.0.0.1:7390}:7380"
    environment:
      DATABASE_URL: postgres://forge:forge@postgres:5432/forge
      # Plain http on this machine; use https and drop this anywhere else.
      FORGE_COOKIE_SECURE: "0"
      # Drift checks read repositories mounted here, and need a Claude API key.
      FORGE_LOCAL_REPOS_ROOT: /repos
      # These come from your shell or a `.env` file next to this one; empty
      # turns the feature off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FORGE_GITHUB_APP_ID: ${FORGE_GITHUB_APP_ID:-}
      FORGE_GITHUB_APP_SLUG: ${FORGE_GITHUB_APP_SLUG:-}
      FORGE_GITHUB_PRIVATE_KEY: ${FORGE_GITHUB_PRIVATE_KEY:-}
      FORGE_GITHUB_WEBHOOK_SECRET: ${FORGE_GITHUB_WEBHOOK_SECRET:-}
      FORGE_GITHUB_CLIENT_ID: ${FORGE_GITHUB_CLIENT_ID:-}
      FORGE_GITHUB_CLIENT_SECRET: ${FORGE_GITHUB_CLIENT_SECRET:-}
      # Signing in with Code Villain (id.codevillain.eu); with it, passwords
      # and GitHub sign-in are off. FORGE_PUBLIC_URL is this Forge's address.
      FORGE_OIDC_ISSUER: ${FORGE_OIDC_ISSUER:-}
      FORGE_OIDC_CLIENT_ID: ${FORGE_OIDC_CLIENT_ID:-}
      FORGE_OIDC_CLIENT_SECRET: ${FORGE_OIDC_CLIENT_SECRET:-}
      FORGE_PUBLIC_URL: ${FORGE_PUBLIC_URL:-http://localhost:7390}
      # 1 behind a proxy that sets X-Forwarded-For (limits per client use it).
      FORGE_TRUST_FORWARDED_FOR: ${FORGE_TRUST_FORWARDED_FOR:-}
    volumes:
      - forge-data:/var/lib/forge
      # The folder containing the vault, read-only, so services can point at
      # repositories in it (Forge's own services use villain-vault).
      - ../../../..:/repos:ro

volumes:
  postgres-data:
  forge-data:
