[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
globset = "0.4"
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
http = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
regex = "1"
reqwest = { version = "0.13", features = ["json", "form"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["uuid-impl", "chrono-impl", "serde-json-impl"] }
uuid = { version = "1.28", features = ["v7", "serde"] }

forge-ai = { path = "crates/ai" }
code-villain-desktop = { path = "../../kit/desktop" }
code-villain-sync = { path = "../../kit/sync" }
forge-domain = { path = "crates/domain" }
forge-server = { path = "crates/server" }
forge-sync = { path = "crates/sync" }

# Password hashing is deliberately slow; unoptimised it makes tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
