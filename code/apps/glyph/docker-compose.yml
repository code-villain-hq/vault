name: code-villain-glyph
services:
  postgres:
    image: postgres:18
    # Come back after Docker restarts, unless stopped on purpose.
    restart: unless-stopped
    environment:
      POSTGRES_USER: glyph
      POSTGRES_PASSWORD: glyph
      POSTGRES_DB: glyph
    ports:
      # 5434 on this machine only: Forge's Postgres has 5433, a local one 5432,
      # and nobody else on the network can reach the data.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glyph"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The whole app, as the team uses it: `bun run app`, then http://localhost:7490.
  glyph:
    profiles: ["app"]
    # From code/, so the image can use the studio's kit (code/kit/sync).
    build:
      context: ../..
      dockerfile: apps/glyph/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # This machine only by default. For teammates, put it behind https and
      # set GLYPH_LISTEN, e.g. 0.0.0.0:7490 (and drop GLYPH_COOKIE_SECURE).
      - "${GLYPH_LISTEN:-127.0.0.1:7490}:7480"
    environment:
      DATABASE_URL: postgres://glyph:glyph@postgres:5432/glyph
      # Plain http on this machine; use https and drop this anywhere else.
      GLYPH_COOKIE_SECURE: "0"
      # The models Glyph translates with. In Docker they run on the host:
      # point their endpoints at host.docker.internal.
      GLYPH_MODELS: /etc/glyph/models.toml
      # The company Glyph runs for, its account (OpenID Connect and SCIM) and
      # its address: required. These come from your shell or a `.env` file
      # next to this one. See glyph.example.toml.
      GLYPH_COMPANY: ${GLYPH_COMPANY:-}
      GLYPH_OIDC_ISSUER: ${GLYPH_OIDC_ISSUER:-}
      GLYPH_OIDC_CLIENT_ID: ${GLYPH_OIDC_CLIENT_ID:-}
      GLYPH_OIDC_CLIENT_SECRET: ${GLYPH_OIDC_CLIENT_SECRET:-}
      GLYPH_SCIM_TOKEN: ${GLYPH_SCIM_TOKEN:-}
      GLYPH_PUBLIC_URL: ${GLYPH_PUBLIC_URL:-http://localhost:7490}
    volumes:
      - ./models.toml:/etc/glyph/models.toml:ro

volumes:
  postgres-data:
