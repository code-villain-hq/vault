[package]
name = "glyph-desktop"
description = "Glyph's desktop app: the web app in a Tauri window, plus native features"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
keyring = "4.2"
code-villain-desktop.workspace = true
glyph-llm.workspace = true
glyph-server.workspace = true
glyph-sync.workspace = true
serde.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# The plugin settings in tauri.conf.json are compiled in as JSON.
serde_json.workspace = true
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.6"
tauri-plugin-opener = "2.7"

[lints]
workspace = true
