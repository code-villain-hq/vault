#
# code-villain.toml: the Code Villain prompt for starship.
#
# Zephyr's layout (a short left prompt, git and timing on the right), in the
# terminal's own ANSI colours and nothing else: no palette, no hex. WezTerm's
# Code Villain scheme fills them, so the prompt follows night and day with
# the terminal. Green is poison, the brand's one bright moment in a shell
# (brand/color.md): a command that worked.
#

add_newline = false
format = """$python$directory$character"""
right_format = """$git_branch$git_status$cmd_duration$status"""
command_timeout = 2000

[character]
success_symbol = "[❯](bright-black)[❯](bold green)"
error_symbol = "[❯](bright-black)[❯](bold red)"
vimcmd_symbol = "[❮](bright-black)[❮](bold purple)"

[python]
format = '[(\($virtualenv\) )]($style)'
style = 'white'

[directory]
style = "blue"
truncation_length = 1
truncation_symbol = ""
fish_style_pwd_dir_length = 1

[git_branch]
format = '[$branch]($style)'
style = 'purple'

# The dirty flag rides on git_status: the group renders only when a state
# fires, so one mark shows for any change. The symbols are U+034F combining
# grapheme joiners, which zsh counts as zero-width on the right prompt.
[git_status]
format = '([•$conflicted$deleted$renamed$modified$typechanged$staged$untracked](yellow))([\[$ahead_behind$stashed\]]($style))'
style = "cyan"
stashed = "≡"
conflicted = "͏"
deleted = "͏"
renamed = "͏"
modified = "͏"
typechanged = "͏"
staged = "͏"
untracked = "͏"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
format = ' [$duration]($style)'
style = 'bright-black'

[line_break]
disabled = true

[status]
disabled = false
pipestatus = true
format = ' [($symbol$int)]($style)'
symbol = '✘'
style = 'red'
pipestatus_format = '\[$pipestatus\]($style)'

[time]
disabled = false
format = '[$time]($style) '
time_format = '%H:%M:%S'
style = 'bright-black'
