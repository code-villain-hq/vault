# `bun run check`, the same as before a commit: the guard, tsc, the frontend
# build, clippy and the Rust tests. macOS, because the app and its PTY tests
# are macOS-only. macOS 26, the oldest the cask allows, rather than
# macos-latest: that moves on to newer ones and would leave 26 untested.
name: check

on:
  pull_request:
  push:
    branches: [main]
  # A release runs this first, on the tagged commit.
  workflow_call:

# Reading the code is all it does.
permissions:
  contents: read

# A new push to a pull request makes its running check worthless. Main and
# releases are never cancelled: each of their commits is checked whole.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-26
    env:
      # Line numbers for a failing test's backtrace, without the rest of the
      # debug info: less to compile, link and cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request is checked out as its merge commit; its first
          # parent is the base, so the two say what the pull request changes.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Saving took up to 50 s a run, and a pull request's cache is read
          # by nothing but its own later pushes. Main's serves them all.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --frozen-lockfile
      # The git tests commit in temp repos, and need an identity to do it.
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      # The tests that drive a real Chrome were a third of the test run. A
      # pull request that leaves the browser and its dependencies alone skips
      # them; main runs them on every merge, so nothing goes unchecked for
      # long.
      - name: Skip the Chrome tests when the browser is untouched
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^src-tauri/(src/browser/|src/commands/browser\.rs|Cargo\.(toml|lock))'; then
            echo "The browser changed: running the Chrome tests."
          else
            echo "VL_SKIP_CHROME_TESTS=1" >> "$GITHUB_ENV"
          fi
      - run: bun run check
