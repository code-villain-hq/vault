<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Villain Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700;800&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono&display=swap">
  <link rel="stylesheet" href="../../design/tokens/color.css">
  <link rel="stylesheet" href="../../design/tokens/type.css">
  <style>
    :root {
      --gutter: clamp(1.25rem, 4.2vw, 3.5rem);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      color-scheme: dark;
      scrollbar-color: var(--muted) var(--night);
    }

    body {
      margin: 0;
      background: var(--night);
      color: var(--ink);
      font-family: var(--font-reading);
      font-size: var(--type-body-size);
      line-height: var(--type-body-leading);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--cloak); color: var(--ink); }
    :focus-visible { outline: 2px solid var(--poison); outline-offset: 3px; }
    a { color: inherit; text-decoration: none; }

    .hero {
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto auto;
      overflow: hidden;
    }

    .splash {
      align-self: center;
      margin: 0;
      padding: clamp(2.5rem, 6vw, 4.5rem) var(--gutter);
      font-family: var(--font-display);
      font-weight: var(--type-splash-weight);
      font-size: var(--type-splash-size);
      line-height: var(--type-splash-leading);
    }

    .splash span {
      display: block;
      width: max-content;
      max-width: 100%;
    }

    /* The poison strike runs through the first line and off both edges. */
    .splash .struck { position: relative; }
    .splash .struck::after {
      content: "";
      position: absolute;
      left: -100vw;
      width: 300vw;
      top: 54%;
      height: clamp(5px, 0.7vw, 10px);
      background: var(--poison);
      pointer-events: none;
    }

    .armor {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem 2rem;
      padding: clamp(1.25rem, 2.4vw, 2rem) var(--gutter);
      background: var(--wash);
    }

    .boast {
      margin: 0;
      font-size: var(--type-title-size);
      font-weight: var(--type-title-weight);
      line-height: var(--type-title-leading);
    }

    .btn-read {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      padding: 0.75rem 1.25rem;
      background: var(--cloak);
      color: var(--ink);
      border: 1px solid var(--poison);
      border-radius: 0;
      font-size: var(--type-label-size);
      font-weight: var(--type-label-weight);
      line-height: var(--type-label-leading);
      letter-spacing: var(--type-label-tracking);
    }

    .btn-read:hover { background: var(--cloak-hover); }

    .products {
      margin: 0;
      padding: 1rem var(--gutter);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      font-size: var(--type-label-size);
      font-weight: var(--type-label-weight);
      letter-spacing: var(--type-label-tracking);
      color: var(--muted);
    }

    .products a:hover {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 0.22em;
    }

    .record {
      width: min(72rem, 100%);
      margin: 0 auto;
      padding: 5.5rem var(--gutter) 6rem;
    }

    .record h2 {
      margin: 0 0 0.75rem;
      font-family: var(--font-display);
      font-weight: var(--type-headline-weight);
      font-size: var(--type-headline-size);
      line-height: var(--type-headline-leading);
    }

    .record h2::after {
      content: "";
      display: block;
      width: 2.5rem;
      height: 2px;
      margin-top: 0.65rem;
      background: var(--cloak);
    }

    .record > p {
      max-width: var(--type-body-measure);
      margin: 0 0 1.5rem;
      color: var(--muted);
    }

    .roster {
      display: grid;
      gap: 0.75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .roster li {
      display: grid;
      gap: 0.15rem;
      padding: 1.1rem 1.25rem;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .roster strong {
      font-size: var(--type-title-size);
      font-weight: var(--type-title-weight);
      line-height: var(--type-title-leading);
    }

    .roster span {
      font-size: var(--type-small-size);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-label="Villain Studios">
      <h1 class="splash">
        <span class="struck">Villain</span>
        <span>Studios</span>
      </h1>
      <div class="armor">
        <p class="boast">Ships real tools. Narrates the build.</p>
        <a class="btn-read" href="../../content/blog/">Read the build.</a>
      </div>
      <p class="products">
        <a href="#forge">Forge</a>
        <span aria-hidden="true">·</span>
        <a href="#layer">Layer</a>
        <span aria-hidden="true">·</span>
        <a href="#caster">Caster</a>
      </p>
    </section>

    <section class="record" id="products" aria-labelledby="roster-heading">
      <h2 id="roster-heading">The tools</h2>
      <p>Three products in the vault. The cloak is purple; the smile is real.</p>
      <ul class="roster">
        <li id="forge">
          <strong>Forge</strong>
          <span>AI-first issue tracker</span>
        </li>
        <li id="layer">
          <strong>Layer</strong>
          <span>Agent development environment for macOS</span>
        </li>
        <li id="caster">
          <strong>Caster</strong>
          <span>Launcher for macOS</span>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
