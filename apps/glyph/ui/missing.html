<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review · Glyph</title>
    <link rel="icon" href="/ui/img/glyph.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/ui/design/fonts/fonts.css">
    <link rel="stylesheet" href="/ui/design/color.css">
    <link rel="stylesheet" href="/ui/design/type.css">
    <link rel="stylesheet" href="/ui/design/shape.css">
    <link rel="stylesheet" href="/ui/design/components.css">
    <link rel="stylesheet" href="/ui/css/glyph.css">
    <link rel="stylesheet" href="/ui/css/review.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/ui/js/theme.js"></script>
    <script src="/ui/js/icons.js"></script>
</head>
<body data-page="missing">
    <div id="toastContainer" class="toast-stack" aria-live="polite"></div>

    <div class="app">
        <aside class="app-side"><script src="/ui/js/frame.js"></script></aside>

        <div class="app-main">
            <header class="app-top">
                <h1 class="app-crumb"><span class="app-crumb-current">Review</span></h1>
            </header>

            <main class="app-content">
                <!-- The lead follows the state of the open language; missing.js
                     fills it. Accept leads while proposals wait, else Suggest. -->
                <div class="view-lead">
                    <div>
                        <h2 class="view-title" id="leadTitle">Loading…</h2>
                        <p class="view-sub" id="leadSub"></p>
                    </div>
                    <div class="review-lead-actions">
                        <button type="button" id="suggestBtn" class="ui-button" hidden></button>
                        <button type="button" id="acceptBtn" class="ui-button ui-button-primary" hidden></button>
                    </div>
                </div>

                <!-- One tab per language with something to review; the filter
                     matches text and the full ns.key. -->
                <div class="review-bar" id="reviewBar" hidden>
                    <div class="ui-tabs review-tabs" role="tablist" aria-label="Language" id="langTabs"></div>
                    <label class="review-search">
                        <input type="search" id="searchInput" class="ui-field" placeholder="Filter keys or text" aria-label="Filter keys or text" autocomplete="off">
                    </label>
                </div>

                <div id="reviewContainer" role="tabpanel"></div>
            </main>
        </div>
    </div>

    <script src="/ui/js/api.js"></script>
    <script src="/ui/js/utils.js"></script>
    <script src="/ui/js/missing.js"></script>
</body>
</html>
