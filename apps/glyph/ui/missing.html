<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review · Glyph</title>
    <link rel="icon" href="/ui/img/glyph.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/ui/design/fonts/fonts.css">
    <link rel="stylesheet" href="/ui/design/color.css">
    <link rel="stylesheet" href="/ui/design/type.css">
    <link rel="stylesheet" href="/ui/design/shape.css">
    <link rel="stylesheet" href="/ui/design/components.css">
    <link rel="stylesheet" href="/ui/css/glyph.css">
    <link rel="stylesheet" href="/ui/css/review.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/ui/js/theme.js"></script>
    <script src="/ui/js/icons.js"></script>
</head>
<body data-page="missing">
    <div id="toastContainer" class="toast-stack" aria-live="polite"></div>

    <div class="app">
        <aside class="app-side"><script src="/ui/js/frame.js"></script></aside>

        <div class="app-main">
            <header class="app-top">
                <h1 class="app-crumb"><span class="app-crumb-current">Review</span></h1>
            </header>

            <main class="app-content">
                <!-- The lead says what the state needs; missing.js fills it. -->
                <div class="view-lead">
                    <div>
                        <h2 class="view-title" id="leadTitle">Loading…</h2>
                        <p class="view-sub" id="leadSub"></p>
                    </div>
                    <button id="translateMissingBtn" class="ui-button ui-button-primary" hidden
                        title="Generate proposals for pending keys in the current view (max 50 per language per run; nothing is saved until you accept each)">Suggest all</button>
                </div>

                <div class="review-toolbar">
                    <label class="review-select">
                        <span class="sr-only">Language</span>
                        <select id="targetLanguage" class="ui-button">
                            <option value="">All languages</option>
                        </select>
                    </label>
                    <label class="review-select">
                        <span class="sr-only">Namespace</span>
                        <select id="namespaceFilter" class="ui-button">
                            <option value="">All namespaces</option>
                        </select>
                    </label>
                    <input type="search" id="searchInput" class="ui-field review-search" placeholder="Filter by key or text" aria-label="Filter by key or text">
                    <button id="acceptAllBtn" class="ui-button review-toolbar-end" hidden></button>
                </div>

                <p class="review-keys">
                    <span><span class="ui-kbd">j</span> <span class="ui-kbd">k</span> move</span>
                    <span><span class="ui-kbd">↵</span> suggest, accept</span>
                    <span><span class="ui-kbd">w</span> write</span>
                    <span><span class="ui-kbd">esc</span> reject</span>
                    <span><span class="ui-kbd">x</span> skip</span>
                </p>

                <div id="reviewContainer"></div>
            </main>
        </div>
    </div>

    <script src="/ui/js/api.js"></script>
    <script src="/ui/js/utils.js"></script>
    <script src="/ui/js/missing.js"></script>
</body>
</html>
