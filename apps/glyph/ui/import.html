<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import · Glyph</title>
    <link rel="icon" href="/ui/img/glyph.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/ui/design/fonts/fonts.css">
    <link rel="stylesheet" href="/ui/design/color.css">
    <link rel="stylesheet" href="/ui/design/type.css">
    <link rel="stylesheet" href="/ui/design/shape.css">
    <link rel="stylesheet" href="/ui/design/components.css">
    <link rel="stylesheet" href="/ui/css/glyph.css">
    <link rel="stylesheet" href="/ui/css/settings.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/ui/js/theme.js"></script>
    <script src="/ui/js/icons.js"></script>
</head>
<body data-page="import">
    <div id="toastContainer" class="toast-stack" aria-live="polite"></div>

    <div class="app">
        <aside class="app-side"><script src="/ui/js/frame.js"></script></aside>

        <div class="app-main">
            <header class="app-top">
                <h1 class="app-crumb"><span class="app-crumb-current">Import</span></h1>
                <!-- Where the flow stands: configure, then review and merge. -->
                <ol class="ml-auto import-steps" aria-label="Import steps">
                    <li id="step1Badge" class="import-step" aria-current="step">1 · Configure</li>
                    <li aria-hidden="true" class="text-faint">›</li>
                    <li id="step2Badge" class="import-step">2 · Review</li>
                </ol>
            </header>

            <main class="app-content">
                <div class="max-w-4xl">
                    <div class="view-lead">
                        <div>
                            <h2 class="view-title" id="importLeadTitle">Import a JSON file</h2>
                            <p class="view-sub" id="importLeadSub">
                                Check where each key lands, including locize-style <span class="code">ns:key</span> prefixes, then merge.
                            </p>
                        </div>
                    </div>

                    <!-- Step 1: configure -->
                    <div id="importStep1">
                        <label class="drop-zone" id="importDropZone" for="importFile">
                            <span data-icon="upload"></span>
                            <span>
                                <span class="drop-zone-title" id="importFileName">Choose a JSON file</span>
                                <span class="drop-zone-help">or drop it here. <span class="code">en.json</span> or <span class="code">en.common.json</span> sets the language and default namespace.</span>
                            </span>
                            <input type="file" id="importFile" accept=".json,application/json" class="sr-only">
                        </label>

                        <div class="grid sm:grid-cols-2 gap-4 mt-6">
                            <div>
                                <label for="importLang" class="field-label">Language code</label>
                                <input type="text" id="importLang" placeholder="e.g. en" maxlength="12" class="ui-field input w-full" autocomplete="off" spellcheck="false">
                            </div>
                            <div>
                                <label for="importDefaultNs" class="field-label">Default namespace</label>
                                <input type="text" id="importDefaultNs" placeholder="translation" class="ui-field input w-full" autocomplete="off" spellcheck="false">
                                <p class="field-help">Only for keys without an <span class="code">ns:key</span> prefix.</p>
                            </div>
                        </div>

                        <div class="flex justify-end mt-6">
                            <button type="button" id="btnToReview" class="ui-button ui-button-primary" disabled>Preview</button>
                        </div>
                    </div>

                    <!-- Step 2: review, then merge -->
                    <div id="importStep2" class="hidden">
                        <p id="reviewSummary" class="text-muted"></p>
                        <div id="reviewNsBreakdown" class="mt-3 flex flex-wrap gap-2"></div>

                        <p class="group-label mt-8">Sample keys <span id="sampleHint"></span></p>
                        <div class="import-sample">
                            <table class="import-table">
                                <thead>
                                    <tr>
                                        <th>Namespace</th>
                                        <th>Key (stored)</th>
                                        <th>Raw key in file</th>
                                        <th>Value</th>
                                    </tr>
                                </thead>
                                <tbody id="reviewTableBody"></tbody>
                            </table>
                        </div>

                        <div class="flex justify-end gap-2 mt-6">
                            <button type="button" id="btnBack" class="ui-button"><span data-icon="chevron-left"></span>Back</button>
                            <button type="button" id="btnRunImport" class="ui-button ui-button-primary">Import</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="/ui/js/api.js"></script>
    <script src="/ui/js/utils.js"></script>
    <script src="/ui/js/import.js"></script>
</body>
</html>
