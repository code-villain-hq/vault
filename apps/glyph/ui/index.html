<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Glyph</title>
    <link rel="icon" href="/ui/img/glyph.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/ui/design/fonts/fonts.css">
    <link rel="stylesheet" href="/ui/design/color.css">
    <link rel="stylesheet" href="/ui/design/type.css">
    <link rel="stylesheet" href="/ui/design/shape.css">
    <link rel="stylesheet" href="/ui/design/components.css">
    <link rel="stylesheet" href="/ui/css/glyph.css">
    <link rel="stylesheet" href="/ui/css/dashboard.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/ui/js/theme.js"></script>
    <script src="/ui/js/icons.js"></script>
</head>
<body data-page="dashboard">
    <div id="toastContainer" class="toast-stack" aria-live="polite"></div>

    <div class="app">
        <aside class="app-side"><script src="/ui/js/frame.js"></script></aside>

        <div class="app-main">
            <header class="app-top">
                <h1 class="app-crumb"><span class="app-crumb-current">Dashboard</span></h1>
            </header>

            <main class="app-content">
                <!-- The lead says what the state needs; dashboard.js fills it. -->
                <div class="view-lead">
                    <div>
                        <h2 class="view-title" id="leadTitle">Loading…</h2>
                        <p class="view-sub" id="leadSub"></p>
                    </div>
                    <a id="leadAction" class="ui-button ui-button-primary" href="/ui/missing.html" hidden></a>
                </div>

                <p class="group-label" id="languagesLabel" hidden></p>
                <div id="languagePairsContainer" class="list"></div>
            </main>
        </div>
    </div>

    <script src="/ui/js/api.js"></script>
    <script src="/ui/js/utils.js"></script>
    <script src="/ui/js/dashboard.js"></script>
</body>
</html>
