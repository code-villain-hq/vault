# Environment for `cargo run` and `cargo test` in local development.
[env]
DATABASE_URL = "postgres://glyph:glyph@localhost:5434/glyph"
TS_RS_EXPORT_DIR = { value = "packages/types/src/generated", relative = true }
# Local development runs on plain http, so session cookies can't be Secure.
GLYPH_COOKIE_SECURE = "0"
